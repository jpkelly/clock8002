# systemd drop-in for alsa-ltc.service — TRIXIE / Raspberry Pi OS target only.
# Install as /etc/systemd/system/alsa-ltc.service.d/20-bounded-startpre.conf
#
# PROBLEM
# The packaged ExecStartPre in v4/alsa-ltc.service waits for the USB audio card
# with an UNBOUNDED loop:
#     until grep -q Device /proc/asound/cards; do sleep 1; done
#
# After a VL805 xHCI host-controller death the card never returns, so every
# start attempt burns the full 90 s TimeoutStartSec, gets SIGTERM'd, and
# restarts forever. Measured on piclock.local 2026-07-28: 333 restarts across
# 8 h 48 min, with the unit permanently reporting SubState=activating.
#
# Because it never lands in 'failed', nothing downstream could tell that LTC
# was dead — the clock silently showed time-of-day all night and no alert
# fired. The unbounded wait is what made the outage invisible.
#
# FIX
# Bound the wait, fail fast, and let the start limiter latch the unit into
# 'failed' so the watchdog and the soak logger can both see it.
#
# NOTE the grep pattern changes from 'Device' to 'USB-Audio'. 'Device' matched
# the card's *name* field, which is fragile; 'USB-Audio' matches the driver
# field and is stable regardless of what the dongle calls itself.

[Unit]
# ~8 failed cycles (~60 s each) inside 10 min, then stop retrying and latch
# into 'failed'. Recovery from that point is the watchdog's job (reboot), since
# no software-level reset can revive a dead VL805.
StartLimitIntervalSec=600
StartLimitBurst=8

[Service]
# Clear the inherited unbounded ExecStartPre before defining the bounded one.
ExecStartPre=
ExecStartPre=/bin/sh -c 'modprobe snd_usb_audio 2>/dev/null || true; n=0; while [ $$n -lt 30 ]; do if grep -q USB-Audio /proc/asound/cards 2>/dev/null; then sleep 2; exit 0; fi; n=$$((n+1)); sleep 1; done; echo "alsa-ltc: no USB audio card after 30s, giving up" >&2; exit 1'

# 30 s wait + 2 s settle + headroom. Must exceed the ExecStartPre bound.
TimeoutStartSec=45
RestartSec=15
