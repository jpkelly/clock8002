# EXPERIMENT 2026-07-27: CM108-class dongles are natively 48kHz. Default 44100
# forces an internal PLL retune and the kernel logs
#   "cannot set freq 44100 to ep 0x82"
# Testing whether running at the native rate stops the mid-stream device hang.
# -v adds peak level to heartbeats (observability only).
[Service]
ExecStart=
ExecStart=/opt/clock8002/alsa-ltc -v - 255.255.255.255 1245 48000
