# Clock-8002 Network Configuration
#
# Place this file at /boot/piclock/network.ini
# Settings are applied automatically on every boot.
# Edit, save, and reboot for changes to take effect.

[network]
# mode: dhcp or static
mode=dhcp

# NTP time synchronization (true or false)
# Disable if using OSC settime to manually control the clock
ntp=false

# Static IP settings (only used when mode=static)
#address=10.0.0.100
#netmask=24
#gateway=10.0.0.1
#dns=1.1.1.1

[host]
# Hostname for the Pi (without .local)
hostname=piclockBR

[wifi]
ap_enabled=true
ap_ssid=piclockBR-ap
ap_password=clockwork
ap_channel=6
ap_country=US
