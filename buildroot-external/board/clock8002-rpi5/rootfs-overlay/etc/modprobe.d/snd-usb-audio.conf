# Prevent mdev from auto-loading snd_usb_audio via $MODALIAS at ~1.5s.
# Explicit modprobe calls (e.g. in alsa-ltc_pokemon.sh) still work.
# Without this, Buildroot 2025.11 mdev loads snd_usb_audio immediately on USB
# device enumeration, causing "Not enough bandwidth for altsetting 0" at ~30s.
blacklist snd_usb_audio
