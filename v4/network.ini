# Clock-8002 Network Configuration
#
# Place this file at /boot/piclock/network.ini
# Settings are applied automatically on every boot.
# Edit, save, and reboot for changes to take effect.

[network]
# mode: dhcp or static
mode=dhcp

# Static IP settings (only used when mode=static)
#address=10.0.0.100
#netmask=24
#gateway=10.0.0.1
#dns=10.0.0.1

[host]
# Hostname for the Pi (without .local)
#hostname=clock8002

[wifi]
# Wi-Fi Access Point — disabled by default
# When enabled, the Pi broadcasts its own Wi-Fi network.
# Clients connect to access the web UI without existing Wi-Fi infrastructure.
ap_enabled=false
# SSID defaults to <hostname>-ap if not set
ap_ssid=
# WPA2 password (minimum 8 characters)
ap_password=clockwork
# Wi-Fi channel
ap_channel=6
