# Clock-8002 Network Configuration
#
# Place this file at /boot/piclock/network.ini
# before first boot to configure networking without SSH.
#
# After editing, insert the SD card and power on the Pi.
# The install script will apply these settings automatically.

[network]
# mode: dhcp or static
mode=dhcp

# Static IP settings (only used when mode=static)
#address=10.0.0.100
#netmask=24
#gateway=10.0.0.1
#dns=10.0.0.1

[host]
# Hostname for the Pi (without .local)
#hostname=clock8002
